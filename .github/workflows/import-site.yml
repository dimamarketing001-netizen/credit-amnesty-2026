name: Import site archive

on:
  push:
    paths:
      - 'credit-amnesty-2026-clean.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack site
        shell: bash
        run: |
          if [ ! -f credit-amnesty-2026-clean.zip ]; then
            echo "Archive already removed; nothing to do."
            exit 0
          fi
          rm -rf /tmp/site-import
          mkdir -p /tmp/site-import
          unzip -q credit-amnesty-2026-clean.zip -d /tmp/site-import
          cp -a /tmp/site-import/credit-amnesty-2026/. .
          rm -f credit-amnesty-2026-clean.zip

      - name: Commit imported files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Import site files"
          git push
